<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Oversikt bedrifter</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="login" id="login" hidden>
    <form class="card login-card" id="login-form" novalidate>
      <h1>Oversikt</h1>
      <p class="muted">Besøk og bookinger for alle bedriftene.</p>
      <label for="pw">Passord</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <label class="check"><input id="remember" type="checkbox"> Husk meg på denne enheten</label>
      <button class="btn" type="submit">Logg inn</button>
      <p class="msg" id="login-msg" role="alert"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="top">
      <h1>Oversikt <span class="muted" id="updated"></span></h1>
      <div class="controls">
        <div class="seg" role="group" aria-label="Periode">
          <button type="button" data-days="7">7 dager</button>
          <button type="button" data-days="30">30 dager</button>
          <button type="button" data-days="90">90 dager</button>
        </div>
        <button type="button" class="ghost" id="refresh">Oppdater</button>
        <button type="button" class="ghost" id="logout">Logg ut</button>
      </div>
    </header>
    <main class="wrap">
      <!-- Statuslinjen står utenfor #data: den vises mens tallene hentes og når hentingen feiler (runde 3) -->
      <p class="msg" id="app-msg" role="alert"></p>
      <div id="data" hidden>
      <section class="card">
        <h2>Sammenligning</h2>
        <div class="table-wrap"><table id="compare"><thead></thead><tbody></tbody></table></div>
        <p class="note">Besøk = noen kom inn på siden utenfra. Andel = bookinger fra nettsiden delt på besøk. Bookinger telles etter dagen de ble gjort; avlyste er med i bookingene og vist for seg.</p>
      </section>
      <label class="check same"><input id="same" type="checkbox" checked> Lik skala i diagrammene (for å sammenligne bedriftene)</label>
      <div id="cards"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
