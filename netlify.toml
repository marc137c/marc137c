[build]
  command = "npm test && node scripts/check-es2015.mjs && node scripts/check-css-assets.mjs"
  publish = "viggos-barbershop"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Timebokens app-fil og service worker (varsler, se netlify/lib/push.mjs og viggos-barbershop/admin-sw.js)
[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/admin-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Bruksanvisningen (README.md) ligger i publiseringsmappen, men skal ikke vises som side (F58)
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
